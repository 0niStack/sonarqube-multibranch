name: docker-build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - .github/workflows/docker-build.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sonarqube-multibranch

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Set vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start stack
        run: docker compose up -d

      - name: Wait for SonarQube to be up
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s http://127.0.0.1:9000/api/system/status | grep -o '"status":"[A-Z]*"' || true)
            echo "attempt $i: $status"
            if echo "$status" | grep -q UP; then
              exit 0
            fi
            sleep 10
          done
          docker compose logs sonarqube
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_ID="${REGISTRY}/$(echo ${IMAGE_NAME} | tr '[:upper:]' '[:lower:]')"
          docker tag ebc/sonarqube-multibranch:8.6.1 "${IMAGE_ID}:8.6.1"
          docker tag ebc/sonarqube-multibranch:8.6.1 "${IMAGE_ID}:latest"
          docker push "${IMAGE_ID}:8.6.1"
          docker push "${IMAGE_ID}:latest"
