name: docker-build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - .github/workflows/docker-build.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sonarqube-multibranch

  SONARQUBE_VERSION: 26.5.0.122743-community
  COMMUNITY_BRANCH_PLUGIN_VERSION: 26.5.0

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show versions
        run: |
          echo "SonarQube version: ${SONARQUBE_VERSION}"
          echo "Community Branch Plugin version: ${COMMUNITY_BRANCH_PLUGIN_VERSION}"

      - name: Build image
        run: |
          docker compose build \
            --build-arg SONARQUBE_VERSION="${SONARQUBE_VERSION}" \
            --build-arg COMMUNITY_BRANCH_PLUGIN_VERSION="${COMMUNITY_BRANCH_PLUGIN_VERSION}"

      - name: Verify local image
        run: |
          docker images | grep sonarqube-multibranch

      - name: Set vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start stack
        run: docker compose up -d

      - name: Wait for SonarQube to be up
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s http://127.0.0.1:9000/api/system/status \
              | grep -o '"status":"[A-Z]*"' || true)

            echo "attempt $i: $status"

            if echo "$status" | grep -q UP; then
              exit 0
            fi

            sleep 10
          done

          docker compose logs sonarqube
          exit 1

      - name: Show SonarQube logs
        if: always()
        run: docker compose logs sonarqube

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_ID="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          echo "Pushing:"
          echo "${IMAGE_ID}:26.5.0"
          echo "${IMAGE_ID}:latest"

          docker tag \
            0niStack/sonarqube-multibranch:26.5.0 \
            "${IMAGE_ID}:26.5.0"

          docker tag \
            0niStack/sonarqube-multibranch:26.5.0 \
            "${IMAGE_ID}:latest"

          docker push "${IMAGE_ID}:26.5.0"
          docker push "${IMAGE_ID}:latest"
